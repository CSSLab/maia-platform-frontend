<!doctype html>
<!--
  The original Maia site's prediction visualizer was here. Microsoft
  Research's post "The human side of AI for chess" still embeds this address
  (maia-viz/#/msr-chess-experience) in an iframe with no height set, so the
  frame is about 150px tall. This page fits that frame and links to the site.
  It is plain HTML, so it loads without the app's code.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maia Chess</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://www.maiachess.com/" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: rgb(23 18 20);
        color: rgb(235 235 235);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      a.card {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 100%;
        min-height: 120px;
        padding: 16px 24px;
        color: inherit;
        text-decoration: none;
        background: radial-gradient(
          ellipse at 0% 0%,
          rgb(159 79 68 / 0.35),
          transparent 60%
        );
      }
      img {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        border-radius: 14px;
      }
      .text {
        flex: 1;
        min-width: 0;
      }
      .short {
        display: none;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.25;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        color: rgb(165 169 174);
      }
      .button {
        flex-shrink: 0;
        padding: 10px 18px;
        border-radius: 6px;
        background: rgb(159 79 68);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        transition: background 0.2s;
      }
      a.card:hover .button,
      a.card:focus-visible .button {
        background: rgb(191 95 82);
      }
      a.card:focus-visible {
        outline: 2px solid rgb(254 127 109);
        outline-offset: -2px;
      }
      /* Phones: a shorter title and text, and the button under them. */
      @media (max-width: 560px) {
        a.card {
          flex-wrap: wrap;
          align-content: center;
          gap: 10px 12px;
          padding: 12px 14px;
        }
        img {
          width: 40px;
          height: 40px;
          border-radius: 9px;
        }
        .text {
          flex-basis: calc(100% - 52px);
        }
        h1 {
          font-size: 16px;
          margin-bottom: 2px;
        }
        p {
          font-size: 13px;
        }
        .long {
          display: none;
        }
        .short {
          display: inline;
        }
        .button {
          flex-basis: 100%;
          text-align: center;
          padding: 8px 14px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <a
      class="card"
      href="https://www.maiachess.com/?ref=maia-viz"
      target="_blank"
      rel="noopener"
    >
      <img src="/maia-viz/maia-icon.png" alt="" width="64" height="64" />
      <div class="text">
        <h1>
          Maia<span class="long">, the human-like chess AI</span
          ><span class="short"> Chess</span>
        </h1>
        <p>
          This demo has moved to maiachess.com<span class="long"
            >, where you can see which moves players at every rating would
            choose in any position, and play against Maia</span
          >.
        </p>
      </div>
      <span class="button">Explore Maia ↗</span>
    </a>
  </body>
</html>
