<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine benchmark</title>
<style>
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  button { font: inherit; padding: 10px 14px; margin: 4px 8px 4px 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f3f3f3; padding: 10px; border-radius: 6px; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } }
</style>
</head>
<body>
<h3>Engine benchmark</h3>
<p>Keep this tab in front. It takes a few minutes on a phone and downloads 78 MB of Stockfish 17's nets, so use Wi-Fi. Close other tabs first if you can. When it's done, copy the results.</p>
<button id="run">Run</button><button id="copy">Copy results</button>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log')
const log = (s) => { logEl.textContent += s + '\n'; try { localStorage.setItem('engine-bench-log', logEl.textContent) } catch (e) {} }
// A phone may reload the tab when it runs out of memory: keep what got done.
try { const saved = localStorage.getItem('engine-bench-log'); if (saved && !saved.trim().endsWith('done')) logEl.textContent = 'From the last run, which did not finish:\n' + saved } catch (e) {}
const ms = (x) => Math.round(x) + ' ms'
const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)]
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/'
const RATINGS = [600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400]
const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous'; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src)); document.head.appendChild(s) })

const FENS = ['r1bqkb1r/pp2pppp/2n2n2/2p5/2Pp4/4PNP1/PP1P1PBP/RNBQK2R w KQkq - 0 6', '2rq1rk1/1b1n1pp1/1p2pn1p/p7/2PQ4/P4NP1/1B2PPBP/R2R2K1 w - - 1 16', '8/4n1pp/3bkp2/1pn1p3/4P3/1P1NNP2/1B2K1PP/8 w - - 2 30']
const NET_HOSTS = ['https://unpkg.com/maia-stockfish-nets@17.0.0/', 'https://cdn.jsdelivr.net/npm/maia-stockfish-nets@17.0.0/']
const until = (sf, cmd, pred, each) => new Promise((res) => { sf.onLine = (l) => { if (each) each(l); if (pred(l)) res() }; sf.uci(cmd) })
const fetchNet = async (name) => {
  for (const host of NET_HOSTS) { try { const r = await fetch(host + name); if (r.ok) return new Uint8Array(await r.arrayBuffer()) } catch (e) {} }
  throw new Error('could not download ' + name)
}
async function makeEngine(kind) {
  const relaxed = WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,15,1,13,0,65,1,253,15,65,2,253,15,253,128,2,11]))
  const dir = kind === 'sf17' ? '/stockfish/sf17/' : '/stockfish/'
  const build = kind === 'sf17' ? 'sf17-79' : relaxed ? 'sf_19_smallnet_relaxed-simd' : 'sf_19_smallnet'
  // Nets first: the time to download them is not what a returning visitor waits for.
  let nets = null
  const mod = await import(dir + build + '.js')
  const memory = new WebAssembly.Memory(kind === 'sf17' ? { shared: true, initial: 2560, maximum: 16384 } : { shared: true, initial: 1024, maximum: 4096 })
  const t0 = performance.now()
  const sf = await mod.default({ wasmMemory: memory, locateFile: (n) => dir + n })
  const moduleMs = performance.now() - t0
  const names = kind === 'sf17' ? [sf.getRecommendedNnue(0), sf.getRecommendedNnue(1)] : [sf.getRecommendedNnue(0)]
  const d0 = performance.now()
  nets = await Promise.all(names.map((n) => (kind === 'sf17' ? fetchNet(n) : fetch('/stockfish/' + n).then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)))))
  const fetchMs = performance.now() - d0
  const c0 = performance.now()
  nets.forEach((b, i) => { sf.HEAPU8 = new Uint8Array(memory.buffer); sf.setNnueBuffer(b, i) })
  sf.onLine = () => {}
  sf.listen = (l) => sf.onLine(l.trim())
  await until(sf, 'uci', (l) => l === 'uciok')
  await until(sf, 'isready', (l) => l === 'readyok')
  const unpackMs = performance.now() - c0
  log(build + ': start ' + ms(moduleMs) + ', nets fetched ' + ms(fetchMs) + ' (' + Math.round(nets.reduce((a, b) => a + b.length, 0) / 1e6) + ' MB), loaded and unpacked ' + ms(unpackMs))
  return { sf, memory }
}
async function search(sf, fen) {
  sf.uci('ucinewgame'); await until(sf, 'isready', (l) => l === 'readyok')
  sf.uci('position fen ' + fen)
  const s = performance.now(); const at = {}; let nps = 0
  await until(sf, 'go depth 18', (l) => l.startsWith('bestmove'), (l) => { const m = /^info depth (\d+) /.exec(l); if (m && !/bound/.test(l)) { at[m[1]] = performance.now() - s; const n = / nps (\d+)/.exec(l); if (n) nps = +n[1] } })
  return { d12: at[12], d18: at[18], nps }
}
async function searches(sf, label) {
  const r = []
  for (const fen of FENS) r.push(await search(sf, fen))
  log(label + ': d12 ' + r.map((x) => ms(x.d12)).join(', ') + ' | d18 ' + r.map((x) => ms(x.d18)).join(', ') + ' | ' + Math.round(med(r.map((x) => x.nps)) / 1000) + 'k nps')
  return r
}
const startMaia = (ep) => new Promise((res, rej) => {
  const w = new Worker('/engine-bench-worker.js')
  w.onerror = (e) => rej(new Error(e.message || 'worker failed'))
  w.onmessage = ({ data }) => { if (data.type === 'started') { w.onmessage = null; res({ w, ...data }) } else if (data.type === 'error') rej(new Error(data.message)) }
  w.postMessage({ type: 'start', ep })
})
const untilMsg = (w, type) => new Promise((res, rej) => { w.onmessage = ({ data }) => { if (data.type === type) res(data); else if (data.type === 'error') rej(new Error(data.message)) } })

async function sf17() {
  log('--- Stockfish 17 (today), 78 MB of nets on the first run')
  const { sf, memory } = await makeEngine('sf17')
  await searches(sf, 'alone')
  log('memory ' + Math.round(memory.buffer.byteLength / 1e6) + ' MB')
  sf.uci('quit')
}

async function together() {
  log('--- Stockfish 19 small net, alone and beside Maia')
  const { sf, memory } = await makeEngine('sf19')
  await searches(sf, 'alone')
  log('memory ' + Math.round(memory.buffer.byteLength / 1e6) + ' MB')
  const a = navigator.gpu ? await navigator.gpu.requestAdapter() : null
  log('WebGPU: ' + (navigator.gpu ? 'yes' : 'no') + ', adapter: ' + (a ? 'yes' : 'no') + ', shader-f16: ' + (a ? a.features.has('shader-f16') : '-'))
  for (const ep of a && a.features.has('shader-f16') ? ['wasm', 'webgpu'] : ['wasm']) {
    log('--- Maia-3 on ' + ep + ', in a worker')
    try {
      const m = await startMaia(ep)
      log('create ' + ms(m.create) + ', first rating ' + ms(m.first) + ', one rating ' + ms(m.one) + ', 10 ratings ' + ms(m.ten) + (ep === 'wasm' ? ', threads ' + (m.threads || 'default') : ''))
      const started = untilMsg(m.w, 'looping')
      m.w.postMessage({ type: 'loop' })
      await started
      await searches(sf, 'Stockfish while Maia runs 10-rating batches')
      const stopped = untilMsg(m.w, 'stopped')
      m.w.postMessage({ type: 'stop' })
      log('batches meanwhile: ' + (await stopped).batches)
      m.w.terminate()
    } catch (e) { log(ep + ' FAILED: ' + String(e && e.message || e).slice(0, 300)) }
  }
}

document.getElementById('run').onclick = async () => {
  logEl.textContent = ''
  log(navigator.userAgent)
  log('cores reported ' + navigator.hardwareConcurrency + ', isolated ' + self.crossOriginIsolated)
  for (const part of [together, sf17]) {
    try { await part() } catch (e) { log(part.name + ' FAILED: ' + (e && e.message || e)) }
  }
  log('done')
}
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(logEl.textContent)
</script>
</body>
</html>
