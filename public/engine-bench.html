<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine benchmark</title>
<style>
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  button { font: inherit; padding: 10px 14px; margin: 4px 8px 4px 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f3f3f3; padding: 10px; border-radius: 6px; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } }
</style>
</head>
<body>
<h3>Engine benchmark</h3>
<p>Keep this tab in front. It takes a minute or two on a phone. Close other tabs first if you can. When it's done, copy the results.</p>
<button id="run">Run</button><button id="copy">Copy results</button>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log')
const log = (s) => { logEl.textContent += s + '\n' }
const ms = (x) => Math.round(x) + ' ms'
const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)]
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/'
const RATINGS = [600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400]
const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous'; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src)); document.head.appendChild(s) })

async function stockfish() {
  log('--- Stockfish 19 small net')
  const relaxed = WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,15,1,13,0,65,1,253,15,65,2,253,15,253,128,2,11]))
  const build = relaxed ? 'sf_19_smallnet_relaxed-simd' : 'sf_19_smallnet'
  log('build ' + build)
  const t0 = performance.now()
  const mod = await import('/stockfish/' + build + '.js')
  const memory = new WebAssembly.Memory({ shared: true, initial: 1024, maximum: 4096 })
  const sf = await mod.default({ wasmMemory: memory, locateFile: (n) => '/stockfish/' + n })
  const net = sf.getRecommendedNnue(0)
  const buf = new Uint8Array(await (await fetch('/stockfish/' + net)).arrayBuffer())
  sf.setNnueBuffer(buf, 0)
  let onLine = () => {}
  sf.listen = (l) => onLine(l.trim())
  const until = (cmd, pred, each) => new Promise((res) => { onLine = (l) => { if (each) each(l); if (pred(l)) res() }; sf.uci(cmd) })
  await until('uci', (l) => l === 'uciok')
  await until('isready', (l) => l === 'readyok')
  log('ready ' + ms(performance.now() - t0))
  const fens = ['r1bqkb1r/pp2pppp/2n2n2/2p5/2Pp4/4PNP1/PP1P1PBP/RNBQK2R w KQkq - 0 6', '2rq1rk1/1b1n1pp1/1p2pn1p/p7/2PQ4/P4NP1/1B2PPBP/R2R2K1 w - - 1 16', '8/4n1pp/3bkp2/1pn1p3/4P3/1P1NNP2/1B2K1PP/8 w - - 2 30']
  for (const fen of fens) {
    sf.uci('ucinewgame'); await until('isready', (l) => l === 'readyok')
    sf.uci('position fen ' + fen)
    const s = performance.now(); const at = {}; let nps = 0
    await until('go depth 18', (l) => l.startsWith('bestmove'), (l) => { const m = /^info depth (\d+) /.exec(l); if (m && !/bound/.test(l)) { at[m[1]] = performance.now() - s; const n = / nps (\d+)/.exec(l); if (n) nps = +n[1] } })
    log('d12 ' + ms(at[12]) + ', d18 ' + ms(at[18]) + ', ' + Math.round(nps / 1000) + 'k nps')
  }
  log('memory ' + Math.round(memory.buffer.byteLength / 1e6) + ' MB')
}

async function maia() {
  log('--- Maia-3')
  await loadScript(ORT + 'ort.webgpu.min.js')
  ort.env.wasm.wasmPaths = ORT
  const a = navigator.gpu ? await navigator.gpu.requestAdapter() : null
  log('WebGPU: ' + (navigator.gpu ? 'yes' : 'no') + ', adapter: ' + (a ? 'yes' : 'no') + ', shader-f16: ' + (a ? a.features.has('shader-f16') : '-') + (a?.info ? ', ' + (a.info.vendor || '') + ' ' + (a.info.architecture || '') : ''))
  const t0 = performance.now()
  const model = new Uint8Array(await (await fetch('/maia3/maia3_simplified.onnx')).arrayBuffer())
  log('model fetched ' + ms(performance.now() - t0))
  const vec = await (await fetch('/engine-bench-vec.json')).json()
  const results = {}
  for (const ep of a && a.features.has('shader-f16') ? ['wasm', 'webgpu'] : ['wasm']) {
    try {
      const c0 = performance.now()
      const s = await ort.InferenceSession.create(model, { executionProviders: [ep], graphOptimizationLevel: 'basic' })
      const create = performance.now() - c0
      const single = [], batch = [], out = []
      for (const v of vec) {
        const one = new Float32Array(v.tokens)
        const t1 = performance.now()
        await s.run({ tokens: new ort.Tensor('float32', one, [1, 64, 12]), elo_self: new ort.Tensor('float32', Float32Array.from([1500]), [1]), elo_oppo: new ort.Tensor('float32', Float32Array.from([1500]), [1]) })
        single.push(performance.now() - t1)
        const k = RATINGS.length, tok = new Float32Array(k * 768)
        for (let j = 0; j < k; j++) tok.set(v.tokens, j * 768)
        const elo = Float32Array.from(RATINGS)
        const t2 = performance.now()
        const o = await s.run({ tokens: new ort.Tensor('float32', tok, [k, 64, 12]), elo_self: new ort.Tensor('float32', elo, [k]), elo_oppo: new ort.Tensor('float32', elo, [k]) })
        batch.push(performance.now() - t2)
        out.push(await o.logits_move.getData ? await o.logits_move.getData() : o.logits_move.data)
      }
      results[ep] = out
      log(ep + ': create ' + ms(create) + ', one rating ' + ms(med(single)) + ' (first ' + ms(single[0]) + '), 10 ratings ' + ms(med(batch)) + ' (first ' + ms(batch[0]) + ')')
      await s.release()
    } catch (e) { log(ep + ' FAILED: ' + String(e).slice(0, 300)) }
  }
  if (results.wasm && results.webgpu) {
    let maxd = 0, sum = 0, n = 0, top = 0, tot = 0
    vec.forEach((v, i) => { const M = results.wasm[i].length / RATINGS.length; for (let j = 0; j < RATINGS.length; j++) {
      const P = (d) => { const l = v.legal.map((x) => d[j * M + x]); const mx = Math.max(...l); const e = l.map((a) => Math.exp(a - mx)); const t = e.reduce((a, b) => a + b, 0); return e.map((a) => a / t) }
      const A = P(results.wasm[i]), B = P(results.webgpu[i])
      A.forEach((p, k) => { if (p >= 0.05 || B[k] >= 0.05) { const d = Math.abs(p - B[k]) * 100; maxd = Math.max(maxd, d); sum += d; n++ } })
      tot++; if (A.indexOf(Math.max(...A)) === B.indexOf(Math.max(...B))) top++ } })
    log('WebGPU vs WASM: same top move ' + top + '/' + tot + ', probabilities off by ' + (sum / n).toFixed(3) + ' points on average, ' + maxd.toFixed(3) + ' at most')
  }
}

document.getElementById('run').onclick = async () => {
  logEl.textContent = ''
  log(navigator.userAgent)
  log('cores reported ' + navigator.hardwareConcurrency + ', isolated ' + self.crossOriginIsolated)
  for (const part of [stockfish, maia]) {
    try { await part() } catch (e) { log(part.name + ' FAILED: ' + (e && e.message || e)) }
  }
  log('done')
}
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(logEl.textContent)
</script>
</body>
</html>
